name: words_arrow_flutter
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev


version: 1.0.0+1

environment:
  sdk: ^3.13.0


dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  audioplayers: ^6.8.1
  path_provider_android: ">=2.2.17 <2.3.0"
  shared_preferences: ^2.5.5
  flutter_animate: ^4.5.2
  flame: ^1.38.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/audio/music/
    - assets/audio/sfx/
    - assets/fonts/
    - assets/images/gameplay/
    - assets/images/boosters/
    - assets/images/icons/
    - assets/images/ui/
    - assets/images/popups/
    - assets/images/backgrounds/
    - assets/images/vfx/
    - assets/images/avatars/
    - assets/images/board/
    - assets/levels/
    - assets/levels/json/

  fonts:
    - family: Panteon
      fonts:
        - asset: assets/fonts/Panteon-Black.ttf
    - family: Orbitron
      fonts:
        - asset: "assets/fonts/Orbitron Bold.otf"
          weight: 700
        - asset: "assets/fonts/Orbitron Medium.otf"
          weight: 500
